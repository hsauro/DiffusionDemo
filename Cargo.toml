[workspace]
resolver = "3"
members = ["crates/rd-core", "apps/diffusion2d"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rd-core = { path = "crates/rd-core" }
egui = "0.36.0"
# glow (WebGL2) instead of the default wgpu renderer: the wasm is much smaller
# and WebGL2 works in current Chrome, Firefox and Safari.
eframe = { version = "0.36.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "web_screen_reader",
    "x11",
] }
log = "0.4.27"
env_logger = "0.11.8"
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3

# Keep `cargo run` and `cargo test` usable without --release:
# the simulation core and all dependencies are optimized even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
